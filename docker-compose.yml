# ──────────────────────────────────────────────────
# PRODUCTION  — docker compose up --build
# Builds the multi-stage 'production' target and
# serves the static bundle through nginx.
# ──────────────────────────────────────────────────

services:
  client:
    image: ${COMPOSE_CLIENT_PROJECT_NAME:-interview-questions}_app:${DOCKER_BUILD_MODE:-production}
    build:
      context: ${DOCKER_BUILD_CONTEXT_DIR:-.}
      dockerfile: ./docker/client/Dockerfile
      target: production
      args:
        FE_FOLDER: ${DOCKER_VOLUME_CLIENT_ROOT_DIR:-client/}
    container_name: ${COMPOSE_CLIENT_PROJECT_NAME:-interview-questions}
    platform: ${DOCKER_PLATFORM:-linux/arm64}  # override to linux/amd64 for x86 servers / CI
    ports:
      - "${WEB_HTTP_PUBLISH_PORT:-80}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

